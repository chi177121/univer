<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>Bản Đồ Hệ Mặt Trời</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;background:#0a0d16}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: sky first, then a gallery of drawn fact cards for whichever body is selected.
   Single dark theme by choice — this is a stargazing page. */
:root{
  --void:#0a0d16;
  --panel:rgba(14,18,28,.92);
  --line:rgba(170,190,230,.19);
  --line-2:rgba(170,190,230,.38);
  --text:#ffffff;
  --mute:#e4e8f2;
  --dim:#c3cad9;
  --accent:#dce6ff;
  --good:#8fd6b0;
  --bad:#e8909d;
  --f-d:'Newsreader',Georgia,serif;
  --f-s:'IBM Plex Sans',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--void);font-size:16px}
@media(min-width:1280px){html{font-size:17px}}
@media(min-width:1700px){html{font-size:18px}}
body{background:var(--void);color:var(--text);font:1rem/1.62 var(--f-s);
  padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased}
@media(min-width:900px){body{padding-inline:28px}}
@media(min-width:1400px){body{padding-inline:40px}}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.m{font-family:var(--f-m);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.wrap{max-width:1240px;margin-inline:auto}
@media(min-width:1700px){.wrap{max-width:1360px}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding-block:16px 14px;border-bottom:1px solid var(--line);position:sticky;
  top:env(safe-area-inset-top,0px);background:var(--void);z-index:5}
.mark{display:flex;align-items:baseline;gap:12px;min-width:0}
.mark h1{margin:0;font-family:var(--f-d);font-weight:300;font-size:1.32rem;white-space:nowrap}
nav{display:flex;gap:2px}
nav button{padding:7px 11px;font-family:var(--f-m);font-size:.7rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid transparent;min-height:36px}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}

.stage{position:relative;margin-top:18px}
#sky{display:block;width:100%;max-width:100%;aspect-ratio:1/1;border:1px solid var(--line);
  border-radius:3px;background:radial-gradient(120% 90% at 50% 45%,#141a2c 0%,#0b0f1a 55%,#070a12 100%);touch-action:manipulation}
@media(min-width:800px){#sky{aspect-ratio:16/10}}
.bare #sky{aspect-ratio:16/11}
@media(min-width:800px){.bare #sky{aspect-ratio:21/9}}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.tools p{margin:0;color:var(--mute);font-size:.8rem;max-width:60ch}
.tset{display:flex;gap:4px;flex:none}
.tset button{padding:6px 12px;border:1px solid var(--line);border-radius:2px;font-family:var(--f-m);
  font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-height:34px}
.tset button:hover{border-color:var(--line-2);color:var(--text)}

.readout{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px;margin-top:14px;min-width:0}
@media(min-width:800px){.readout{position:absolute;left:16px;bottom:16px;width:min(330px,38%);margin:0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.bare .readout,.bare .scale,.bare .gal{display:none}
.r-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.r-nav .m{color:var(--c)}
.r-arrows{display:flex;gap:2px;flex:none}
.r-arrows button{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:2px;color:var(--mute);font-size:.8rem}
.r-arrows button:hover{border-color:var(--line-2);color:var(--text)}
.r-name{margin:8px 0 6px;font-family:var(--f-d);font-weight:300;font-size:1.95rem;line-height:1.05;overflow-wrap:anywhere}
.r-tag{margin:0;color:var(--mute);font-size:.87rem;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
.grid dt{font-family:var(--f-m);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.grid dd{margin:3px 0 0;font-family:var(--f-m);font-size:.79rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.scale{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.scale p{margin:5px 0 0;color:var(--mute);font-size:.8rem;max-width:60ch}
.ruler{position:relative;height:30px;margin:16px 0 6px}
.ruler::before{content:"";position:absolute;left:0;right:0;top:15px;height:1px;background:var(--line-2)}
.ruler button{position:absolute;top:0;width:22px;height:30px;transform:translateX(-11px);display:grid;place-items:center}
.ruler i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block;transition:transform .2s}
.ruler button:hover i,.ruler button[aria-pressed="true"] i{transform:scale(1.75)}
.ruler-ends{display:flex;justify-content:space-between}

/* gallery */
.gal{margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.gal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.gal-head i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.gal-head h3{margin:0;font-family:var(--f-d);font-weight:400;font-size:1.15rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:14px}
@media(min-width:1280px){.cards{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}}
.fc{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#11151f;min-width:0}
.fc:hover{border-color:var(--line-2)}
.ill{aspect-ratio:8/5;background:radial-gradient(90% 90% at 50% 45%,rgba(255,255,255,.07),rgba(0,0,0,0)),#0e121c;position:relative}
.ill svg{display:block;width:100%;height:100%}
.fc .tx{padding:14px 15px 16px}
.fc h4{margin:0 0 7px;font-size:.95rem;font-weight:600;line-height:1.38;text-wrap:balance}
.fc p{margin:0;color:var(--mute);font-size:.85rem;line-height:1.65}
.fc p em{color:var(--text);font-style:normal;font-weight:500}

/* games */
.panelw{max-width:760px;margin:26px auto 0}
.box{border:1px solid var(--line);border-radius:3px;padding:clamp(20px,4vw,34px)}
.box h2{margin:10px 0 10px;font-family:var(--f-d);font-weight:300;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.12;text-wrap:balance}
.box .lead{margin:0 0 26px;color:var(--mute);font-size:.93rem;max-width:none}
.go{border:1px solid var(--line-2);border-radius:2px;padding:11px 22px;font-family:var(--f-m);
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;min-height:44px}
.go:hover{background:var(--text);color:var(--void);border-color:var(--text)}
.row{display:flex;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;align-items:baseline}
.ticks{display:flex;gap:4px;margin:14px 0 26px}
.ticks i{flex:1;height:1px;background:var(--line)}
.ticks i.done{background:var(--accent)}
.ticks i.now{background:var(--mute)}
.ask{font-family:var(--f-d);font-weight:300;font-size:clamp(1.25rem,3.4vw,1.72rem);line-height:1.28;margin:0 0 26px;text-wrap:balance}
.duo{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.duo{grid-template-columns:1fr 1fr}}
.duo button{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:3px;
  padding:18px;min-height:70px;text-align:left;font-size:1.02rem;font-weight:500;min-width:0}
.duo button i{width:24px;height:24px;border-radius:50%;background:var(--c);flex:none}
.duo button span{overflow-wrap:anywhere}
.duo button:hover:not(:disabled){border-color:var(--c)}
.duo button:disabled{cursor:default}
.duo button.hit{border-color:var(--good);color:var(--good)}
.duo button.hit i{box-shadow:0 0 0 2px var(--good)}
.duo button.miss{border-color:var(--bad);color:var(--bad)}
.duo button.dim{opacity:.35}
.viz{margin:24px 0 2px}
.vbar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.vbar .n{flex:none;width:108px;font-size:.81rem;overflow-wrap:anywhere}
.vbar .track{flex:1;height:9px;background:rgba(158,178,218,.1);border-radius:2px;overflow:hidden;min-width:0}
.vbar .track i{display:block;height:100%;background:var(--c);border-radius:2px}
.vbar .v{flex:none;font-family:var(--f-m);font-size:.79rem;font-variant-numeric:tabular-nums}
.vsize{display:flex;align-items:flex-end;justify-content:center;gap:clamp(20px,7vw,46px);padding:6px 0 2px;flex-wrap:wrap}
.vsize figure{margin:0;text-align:center;min-width:0}
.vsize .ball{border-radius:50%;background:var(--c);margin:0 auto 10px;max-width:100%}
.vsize figcaption{font-size:.79rem}
.vsize .v{display:block;font-family:var(--f-m);font-size:.75rem;color:var(--mute);margin-top:3px}
.verdict{border-top:1px solid var(--line);padding-top:20px;margin-top:8px}
.vrow{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}
.vrow div b{display:block;font-family:var(--f-m);font-size:1.3rem;font-variant-numeric:tabular-nums;margin-top:5px}
.vrow div b.ok{color:var(--good)}
.vrow div b.no{color:var(--bad)}
.verdict p{margin:0;color:var(--mute);font-size:.9rem;line-height:1.64;max-width:none}
.after{display:flex;justify-content:flex-end;margin-top:22px}
/* bạn ở đó */
.tune{display:grid;grid-template-columns:1fr;gap:20px;margin:6px 0 30px}
@media(min-width:560px){.tune{grid-template-columns:1fr 1fr;gap:30px}}
.tune .lv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.tune .lv b{font-family:var(--f-m);font-size:1.3rem;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;display:block;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:1px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);margin-top:-7.5px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--text)}
.hl{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:30px}
@media(min-width:620px){.hl{grid-template-columns:repeat(3,1fr)}}
.hl div{border-left:2px solid var(--c);padding-left:14px;min-width:0}
.hl b{display:block;font-family:var(--f-d);font-weight:300;font-size:1.45rem;line-height:1.15;margin-top:5px}
.hl em{font-style:normal;color:var(--mute);font-size:.8rem;display:block;margin-top:4px}
.you{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
@media(min-width:760px){.you{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:1280px){.you{gap:18px}}
.yc{border:1px solid var(--line);border-radius:3px;padding:14px;min-width:0}
.yc .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.yc .hd i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.yc .hd span{font-size:.87rem;font-weight:600;overflow-wrap:anywhere}
.yc svg{display:block;width:100%;height:auto;margin-bottom:6px}
.yc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:baseline}
.yc dt{font-family:var(--f-m);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.yc dd{margin:0;font-family:var(--f-m);font-size:.81rem;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big{font-family:var(--f-d);font-weight:200;font-size:clamp(3rem,13vw,5.4rem);line-height:1;font-variant-numeric:tabular-nums;margin:12px 0}
.big small{font-family:var(--f-m);font-size:.16em;letter-spacing:.14em;color:var(--mute);margin-left:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="mark">
      <h1>Hệ Mặt Trời</h1>
      <span class="m" id="counter"></span>
    </div>
    <nav role="tablist" aria-label="Chế độ">
      <button role="tab" data-view="map" aria-selected="true">Bản đồ</button>
      <button role="tab" data-view="ab" aria-selected="false">Cái nào hơn</button>
      <button role="tab" data-view="tf" aria-selected="false">Thật hay xạo</button>
      <button role="tab" data-view="you" aria-selected="false">Bạn ở đó</button>
    </nav>
  </header>

  <main>
    <section id="view-map">
      <div class="stage" id="stage">
        <canvas id="sky" role="img" aria-label="Bản đồ hệ Mặt Trời nhìn từ trên xuống, tám hành tinh quay quanh Mặt Trời"></canvas>
        <aside class="readout" id="readout" aria-live="polite"></aside>
      </div>
      <div class="tools">
        <p>Chạm vào một thiên thể để đổi hồ sơ. Bản đồ nén khoảng cách cho tám quỹ đạo cùng lọt khung.</p>
        <div class="tset">
          <button type="button" id="motion">Dừng</button>
          <button type="button" id="bare">Ẩn bảng</button>
        </div>
      </div>
      <div class="scale">
        <span class="m">Khoảng cách thật, đúng tỉ lệ</span>
        <p>Đây mới là hình dạng thật của hệ: bốn hành tinh đá dồn hết vào 5% đầu tiên, phần còn lại gần như trống không.</p>
        <div class="ruler" id="ruler"></div>
        <div class="ruler-ends"><span class="m">Mặt Trời</span><span class="m">4,5 tỉ km</span></div>
      </div>
      <div class="gal">
        <div class="gal-head" id="galHead"></div>
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <section id="view-ab" hidden><div class="panelw" id="abBox"></div></section>
    <section id="view-tf" hidden><div class="panelw" id="tfBox"></div></section>
    <section id="view-you" hidden><div class="panelw" id="youBox" style="max-width:940px"></div></section>
  </main>
</div>

function num(v,d){return v.toLocaleString('vi-VN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}

 '<g stroke="'+W1+'" stroke-width="1.6"><path d="M84 96 L186 96" stroke-dasharray="4 5"/><path d="M84 90 L84 102"/><path d="M186 90 L186 102"/></g>'+
 '<path d="M120 120 L120 132" stroke="'+DIMS+'" stroke-width="1.6"/>'),
back:wrap('<path d="M14 124 L226 124" stroke="'+DIMS+'" stroke-width="2"/>'+
 '<path d="M26 118 Q120 18 214 118" stroke="'+DIMS+'" stroke-width="2" stroke-dasharray="4 6"/>'+
 '<circle cx="60" cy="72" r="10" fill="'+SUNC+'" opacity=".32"/>'+
 '<circle cx="166" cy="60" r="10" fill="'+SUNC+'" opacity=".32"/>'+
 '<circle cx="122" cy="43" r="14" fill="'+SUNC+'"/><circle cx="122" cy="43" r="23" fill="'+SUNC+'" opacity=".16"/>'+

/* ---------- sky ---------- */
var cv=$('#sky'),g=cv.getContext('2d');
var W=0,H=0,stars=[],hits=[],sel='earth',run=!reduce,t=0,last=0,raf=0;
var ORB=[.155,.245,.335,.425,.575,.70,.825,.945];
var PER=[.241,.615,1,1.881,11.86,29.46,84,164.8];
var RAD=[3.1,5.4,5.8,4.2,13.5,11.6,8.2,8.0];
var ANG=[.55,2.35,4.15,5.4,1.15,3.25,5.85,2.05];
var SPD=PER.map(function(p){return .22/Math.pow(p,.62)});

function seed(){
  stars=[];
  var tint=['#ffffff','#ffffff','#dfe7ff','#cfdcff','#fff0d8','#ffe2bd'];
  for(var i=0;i<255;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.pow(Math.random(),2.4)*1.5+.22,
    a:.18+Math.random()*.55,c:tint[(Math.random()*tint.length)|0],p:Math.random()*6.28,s:.4+Math.random()*1.6});
  for(var j=0;j<185;j++){var u=Math.random(),gz=(Math.random()+Math.random()+Math.random()-1.5)*.075;
    stars.push({x:u,y:.22+u*.56+gz,r:Math.pow(Math.random(),3)*1.1+.18,
      a:.12+Math.random()*.34,c:tint[(Math.random()*tint.length)|0],p:Math.random()*6.28,s:.4+Math.random()*1.6})}}
function fit(){
  var r=cv.getBoundingClientRect();if(!r.width)return;
  var d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
  if(!stars.length)seed();paint()}
if(window.ResizeObserver)new ResizeObserver(function(){if(view==='map')fit()}).observe(cv);
else window.addEventListener('resize',function(){if(view==='map')fit()});

function ring(x,y,pr,back){
  g.save();g.translate(x,y);g.rotate(-.34);
  g.strokeStyle='rgba(214,192,135,.62)';g.lineWidth=Math.max(1.1,pr*.22);g.beginPath();
  if(back)g.ellipse(0,0,pr*2.05,pr*.62,0,Math.PI,6.283);else g.ellipse(0,0,pr*2.05,pr*.62,0,0,Math.PI);
  g.stroke();g.restore()}
function paint(){
  if(!W)return;
  var cx=W/2,cy=H/2,half=Math.min(W,H)/2-4,s=half/300;
  g.clearRect(0,0,W,H);
  g.save();g.translate(W/2,H/2);g.rotate(.51);
  var bg=g.createLinearGradient(0,-H*.42,0,H*.42);
  bg.addColorStop(0,'rgba(120,140,200,0)');bg.addColorStop(.5,'rgba(126,146,205,.062)');bg.addColorStop(1,'rgba(120,140,200,0)');
  g.fillStyle=bg;g.fillRect(-W,-H*.42,W*2,H*.84);g.restore();
  for(var i=0;i<stars.length;i++){var sx=stars[i];
    g.globalAlpha=reduce?sx.a:sx.a*(.72+.28*Math.sin(t*sx.s+sx.p));
    g.fillStyle=sx.c;g.beginPath();g.arc(sx.x*W,sx.y*H,sx.r,0,6.283);g.fill()}
  g.globalAlpha=1;hits=[];
  for(var k=0;k<8;k++){
    g.beginPath();g.arc(cx,cy,ORB[k]*half,0,6.283);
    g.strokeStyle=P[k].id===sel?'rgba(185,205,240,.40)':'rgba(175,195,235,.16)';g.lineWidth=1;g.stroke()}
  var pl=reduce?1:1+.02*Math.sin(t*1.1),sr=17*s;
  var gl=g.createRadialGradient(cx,cy,sr*.6,cx,cy,86*s*pl);
  gl.addColorStop(0,'rgba(255,196,110,.30)');gl.addColorStop(.38,'rgba(255,178,80,.075)');gl.addColorStop(1,'rgba(255,170,70,0)');
  g.fillStyle=gl;g.beginPath();g.arc(cx,cy,86*s*pl,0,6.283);g.fill();
  var sg=g.createRadialGradient(cx,cy,0,cx,cy,sr);
  sg.addColorStop(0,'#fffaf0');sg.addColorStop(.45,'#ffd68a');sg.addColorStop(1,'#f4a53c');
  g.fillStyle=sg;g.beginPath();g.arc(cx,cy,sr,0,6.283);g.fill();
  hits.push({id:'sun',x:cx,y:cy,r:sr});
  if(sel==='sun'){g.strokeStyle='rgba(255,194,87,.7)';g.lineWidth=1;g.beginPath();g.arc(cx,cy,sr+9,0,6.283);g.stroke()}
  var lab=W>=520;g.textAlign='center';
  for(var j=0;j<8;j++){
    var b=P[j],ag=ANG[j],x=cx+Math.cos(ag)*ORB[j]*half,y=cy+Math.sin(ag)*ORB[j]*half;
    var pr=Math.max(2.4,RAD[j]*s);
    var dx=cx-x,dy=cy-y,dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
    if(b.id==='saturn')ring(x,y,pr,true);
    var pg=g.createRadialGradient(x+dx*pr*.62,y+dy*pr*.62,pr*.06,x,y,pr*1.28);
    pg.addColorStop(0,lite(b.c,.52));pg.addColorStop(.42,b.c);pg.addColorStop(.78,dk(b.c,.52));pg.addColorStop(1,dk(b.c,.88));
    g.fillStyle=pg;g.beginPath();g.arc(x,y,pr,0,6.283);g.fill();
    if((b.id==='jupiter'||b.id==='saturn')&&pr>7){
      g.save();g.beginPath();g.arc(x,y,pr,0,6.283);g.clip();
      for(var n=-2;n<=2;n++){g.globalAlpha=.09+.05*((n+2)%2);
        g.fillStyle=n%2?lite(b.c,.3):dk(b.c,.35);
        g.beginPath();g.ellipse(x,y+n*pr*.32,pr*1.1,pr*.12,-.32,0,6.283);g.fill()}
      g.globalAlpha=1;g.restore()}
    if(b.id==='saturn')ring(x,y,pr,false);
    hits.push({id:b.id,x:x,y:y,r:pr});
    if(b.id===sel){g.strokeStyle='rgba(233,235,243,.55)';g.lineWidth=1;g.beginPath();g.arc(x,y,pr+8,0,6.283);g.stroke()}
    if(lab||b.id===sel){g.font=(b.id===sel?'500 ':'400 ')+'10.5px "IBM Plex Mono",monospace';
      g.fillStyle=b.id===sel?'rgba(255,255,255,.98)':'rgba(255,255,255,.78)';
      g.fillText(b.name,x,y+pr+(b.id==='saturn'?17:14))}}
  if(sel==='sun'||lab){g.font=(sel==='sun'?'500 ':'400 ')+'10.5px "IBM Plex Mono",monospace';
    g.fillStyle=sel==='sun'?'rgba(255,255,255,.98)':'rgba(255,255,255,.78)';
    g.fillText('Mặt Trời',cx,cy+sr+15)}}
function step(ts){
  if(view!=='map'||document.hidden){raf=0;return}
  var dt=last?Math.min((ts-last)/1000,.05):0;last=ts;t+=dt;
  if(run)for(var i=0;i<8;i++)ANG[i]+=SPD[i]*dt;
  paint();raf=requestAnimationFrame(step)}
function loop(){if(raf)return;last=0;raf=requestAnimationFrame(step)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view==='map')loop()});
function near(e){var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null,bd=1e9;
  hits.forEach(function(h){var d=Math.hypot(h.x-x,h.y-y),lim=Math.max(22,h.r+11);if(d<lim&&d<bd){bd=d;best=h}});return best}
cv.addEventListener('pointerdown',function(e){var h=near(e);if(h)pickBody(h.id)});
cv.addEventListener('pointermove',function(e){cv.style.cursor=near(e)?'pointer':'default'});

$('#motion').textContent=run?'Dừng':'Chạy';

  var ta=thing(it.a.id),tb=thing(it.b.id);

  if(it.viz==='size'){
    var mx=Math.max(it.a.v,it.b.v),cap=120;
    return '<div class="viz"><div class="vsize">'+[[ta,it.a.v],[tb,it.b.v]].map(function(p){
      var d=Math.max(14,Math.round(p[1]/mx*cap));
      return '<figure style="--c:'+p[0].c+'"><div class="ball" style="width:'+d+'px;height:'+d+'px"></div>'+

  var m2=Math.max(it.a.v,it.b.v);
  return '<div class="viz">'+[[ta,it.a.v],[tb,it.b.v]].map(function(p){

  if(!A){box.innerHTML='<div class="box"><span class="m">Trò chơi 01 · dễ nhất</span>'+

  if(A.i>=AN){box.innerHTML='<div class="box"><span class="m">Kết quả</span><div class="big">'+A.pts+'<small>/ '+AN+'</small></div>'+
    '<h2>'+(A.pts>=5?'Linh cảm của bạn chuẩn đấy.':A.pts>=3?'Hơn một nửa, không tệ chút nào.':'Vũ trụ thích trêu người, đúng không.')+'</h2>'+
    '<p class="lead">Mấy câu bạn đoán trượt thường là mấy câu thú vị nhất. Ghé qua tab Bản đồ xem lý do đằng sau chúng.</p>'+
    '<button class="go" type="button" data-a="start">Chơi lại</button></div>';return}
  var it=A.l[A.i],pk=A.pick;
  var ticks=A.l.map(function(_,i){return '<i class="'+(i<A.i?'done':i===A.i?'now':'')+'"></i>'}).join('');
  var opt=function(key){
    var o=it[key],tg=thing(o.id),cls='';
    if(pk){cls=key===it.win?' hit':(key===pk?' miss':' dim')}
    return '<button class="'+cls.trim()+'" type="button" style="--c:'+tg.c+'" data-k="'+key+'"'+(pk?' disabled':'')+'>'+
      '<i></i><span>'+esc(tg.name)+'</span></button>'};
  var after='';
  if(pk){var ok=pk===it.win;
    after=vizOf(it)+'<div class="verdict" style="margin-top:18px"><div class="vrow"><div><span class="m">'+
      (ok?'Chuẩn':'Hụt rồi')+'</span><b class="'+(ok?'ok':'no')+'">'+esc(thing(it[it.win].id).name)+'</b></div></div>'+
      '<p>'+esc(it.why)+'</p></div>'+
      '<div class="after"><button class="go" type="button" data-a="next">'+(A.i===AN-1?'Kết quả':'Câu tiếp')+'</button></div>'}
  box.innerHTML='<div class="box"><div class="row"><span class="m">Câu '+(A.i+1)+' / '+AN+'</span><span class="m">'+A.pts+' đúng</span></div>'+
    '<div class="ticks">'+ticks+'</div><p class="ask">'+esc(it.q)+'</p>'+
    '<div class="duo">'+opt('a')+opt('b')+'</div>'+after+'</div>'}
$('#abBox').addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');
  if(a){if(a.dataset.a==='start')startAB();
    else if(a.dataset.a==='next'){A.i++;A.pick=null;
      if(A.i>=AN&&A.pts>S.bestA){S.bestA=A.pts;save()}drawAB()}
    return}
  var k=e.target.closest('[data-k]');if(!k||!A||A.pick)return;
  A.pick=k.dataset.k;if(A.pick===A.l[A.i].win)A.pts++;
  drawAB();var nb=$('[data-a="next"]',$('#abBox'));if(nb)nb.focus()});

/* ---------- thật hay xạo ---------- */
var TN=8,T=null;
function startTF(){
  var real=shuffle(TFQ.filter(function(q){return q.r})).slice(0,4);
  var fake=shuffle(TFQ.filter(function(q){return !q.r})).slice(0,4);
  T={l:shuffle(real.concat(fake)),i:0,pts:0,pick:null};drawTF()}
function drawTF(){
  var box=$('#tfBox');
  if(!T){box.innerHTML='<div class="box"><span class="m">Trò chơi 02 · dễ</span>'+
    '<h2>Thật hay xạo?</h2><p class="lead">Tám câu nghe đều hoang đường như nhau. Một nửa là chuyện có thật, một nửa mình bịa ra. Đoán bừa cũng được 50%, nhưng mấy câu thật thường là mấy câu khó tin nhất.</p>'+
    '<div class="row" style="margin-bottom:24px"><span class="m">Kỷ lục '+S.bestT+' / '+TN+'</span></div>'+
    '<button class="go" type="button" data-a="start">Chơi thử</button></div>';return}
  if(T.i>=TN){box.innerHTML='<div class="box"><span class="m">Kết quả</span><div class="big">'+T.pts+'<small>/ '+TN+'</small></div>'+
    '<h2>'+(T.pts>=7?'Khó lừa được bạn.':T.pts>=5?'Trên mức đoán bừa, ổn rồi.':'Vũ trụ thật còn lạ hơn mấy thứ mình bịa.')+'</h2>'+
    '<button class="go" type="button" data-a="start">Chơi lại</button></div>';return}
  var it=T.l[T.i],pk=T.pick;
  var ticks=T.l.map(function(_,i){return '<i class="'+(i<T.i?'done':i===T.i?'now':'')+'"></i>'}).join('');
  var opt=function(v,lab,col){
    var cls='';if(pk!==null){cls=(v===it.r?' hit':(v===pk?' miss':' dim'))}
    return '<button class="'+cls.trim()+'" type="button" style="--c:'+col+'" data-v="'+v+'"'+(pk!==null?' disabled':'')+'>'+
      '<i></i><span>'+lab+'</span></button>'};
  var after='';
  if(pk!==null){var ok=pk===it.r;
    after='<div class="verdict" style="margin-top:22px"><div class="vrow"><div><span class="m">'+
      (ok?'Đoán chuẩn':'Trượt rồi')+'</span><b class="'+(ok?'ok':'no')+'">'+(it.r?'Chuyện này có thật':'Cái này mình bịa')+'</b></div></div>'+
      '<p>'+esc(it.w)+'</p></div>'+
      '<div class="after"><button class="go" type="button" data-a="next">'+(T.i===TN-1?'Kết quả':'Câu tiếp')+'</button></div>'}
  box.innerHTML='<div class="box"><div class="row"><span class="m">Câu '+(T.i+1)+' / '+TN+'</span><span class="m">'+T.pts+' đúng</span></div>'+
    '<div class="ticks">'+ticks+'</div><p class="ask">'+esc(it.s)+'</p>'+
    '<div class="duo">'+opt(true,'Thật','#8fd6b0')+opt(false,'Xạo','#e8909d')+'</div>'+after+'</div>'}
$('#tfBox').addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');
  if(a){if(a.dataset.a==='start')startTF();
    else if(a.dataset.a==='next'){T.i++;T.pick=null;
      if(T.i>=TN&&T.pts>S.bestT){S.bestT=T.pts;save()}drawTF()}
    return}
  var v=e.target.closest('[data-v]');if(!v||!T||T.pick!==null)return;
  T.pick=v.dataset.v==='true';if(T.pick===T.l[T.i].r)T.pts++;
  drawTF();var nb=$('[data-a="next"]',$('#tfBox'));if(nb)nb.focus()});

/* ---------- bạn ở đó ---------- */
var YOU=[
{id:'mercury',p:0.241,g:0.38},
{id:'venus',p:0.615,g:0.90},
{id:'earth',p:1,g:1},
{id:'moon',p:null,g:0.165},
{id:'mars',p:1.881,g:0.38},
{id:'jupiter',p:11.86,g:2.53},
{id:'saturn',p:29.46,g:1.06},
{id:'uranus',p:84.01,g:0.90},
{id:'neptune',p:164.8,g:1.14}];
var JUMP0=0.5;
function kg(v){return num(v,v<10?1:0)+' kg'}
function hgt(m){return m<1?num(m*100,0)+' cm':num(m,m<10?2:1)+' m'}
function yrs(v){return num(v,v>=10?0:(v>=1?1:2))+' tuổi'}
function jumpArt(m,c){
  var bar=6+52*Math.min(m,3.1)/3.1,ap=66-bar,cy=2*ap-66;
  return '<svg viewBox="0 0 120 74" fill="none" stroke-linecap="round" aria-hidden="true">'+
    '<path d="M4 66 L116 66" stroke="rgba(158,178,218,.28)" stroke-width="1.5"/>'+
    '<path d="M26 66 Q64 '+cy.toFixed(1)+' 102 66" stroke="'+c+'" stroke-width="1.6" stroke-dasharray="3 4" opacity=".9"/>'+
    '<circle cx="14" cy="46" r="4.5" fill="'+c+'"/>'+
    '<path d="M14 51.5 L14 58 M8.5 54 L19.5 54 M14 58 L10 66 M14 58 L18 66" stroke="'+c+'" stroke-width="2"/>'+
    '<circle cx="102" cy="66" r="2.2" fill="'+c+'" opacity=".8"/></svg>'}
function youRows(){
  var age=S.age||22,w=S.wt||60;
  return YOU.map(function(y){var t=thing(y.id);
    return {name:t.name,c:t.c,age:y.p?age/y.p:null,moons:y.p?null:age*12.37,w:w*y.g,jump:JUMP0/y.g}})}
function refreshYou(){
  var rows=youRows();
  var light=rows.slice().sort(function(a,b){return a.w-b.w})[0];
  var heavy=rows.slice().sort(function(a,b){return b.w-a.w})[0];
  var young=rows.filter(function(r){return r.age!==null}).sort(function(a,b){return a.age-b.age})[0];
  $('#agev').textContent=(S.age||22);
  $('#wtv').textContent=(S.wt||60)+' kg';
  $('#hl').innerHTML=
    '<div style="--c:'+light.c+'"><span class="m">Nhẹ nhất ở</span><b>'+esc(light.name)+'</b><em>Bạn còn '+kg(light.w)+', bật một cái là lên tới '+hgt(light.jump)+'.</em></div>'+
    '<div style="--c:'+heavy.c+'"><span class="m">Nặng nhất ở</span><b>'+esc(heavy.name)+'</b><em>Bạn thành '+kg(heavy.w)+', nhấc chân lên thôi đã thấy nặng.</em></div>'+
    '<div style="--c:'+young.c+'"><span class="m">Trẻ nhất ở</span><b>'+esc(young.name)+'</b><em>Ở đó bạn mới '+yrs(young.age)+', chưa kịp đón sinh nhật đầu tiên.</em></div>';
  $('#youCards').innerHTML=rows.map(function(r){
    return '<article class="yc" style="--c:'+r.c+'"><div class="hd"><i></i><span>'+esc(r.name)+'</span></div>'+
      jumpArt(r.jump,r.c)+'<dl>'+
      (r.age!==null?'<dt>Tuổi</dt><dd>'+yrs(r.age)+'</dd>':'<dt>Trăng tròn</dt><dd>'+num(r.moons,0)+' lần</dd>')+
      '<dt>Cân nặng</dt><dd>'+kg(r.w)+'</dd>'+
      '<dt>Nhảy cao</dt><dd>'+hgt(r.jump)+'</dd></dl></article>'}).join('')}
var youBuilt=false;
function drawYou(){
  if(youBuilt){refreshYou();return}
  var age=S.age||22,w=S.wt||60;
  $('#youBox').innerHTML='<div class="box">'+
    '<span class="m">Không phải trò đố · chỉ là bạn</span>'+
    '<h2>Bạn sẽ ra sao nếu đứng ở đó?</h2>'+
    '<p class="lead">Kéo hai thanh bên dưới rồi xem chính mình đổi khác thế nào khắp hệ. Tuổi tính theo số vòng mà nơi đó đã đi quanh Mặt Trời kể từ ngày bạn sinh ra. Độ nhảy tính từ một cú bật tại chỗ cao nửa mét trên Trái Đất.</p>'+
    '<div class="tune">'+
      '<label><span class="lv"><span class="m">Tuổi của bạn</span><b id="agev">'+age+'</b></span>'+
      '<input type="range" id="ager" min="1" max="90" step="1" value="'+age+'" aria-label="Tuổi của bạn"></label>'+
      '<label><span class="lv"><span class="m">Cân nặng trên Trái Đất</span><b id="wtv">'+w+' kg</b></span>'+
      '<input type="range" id="wtr" min="20" max="150" step="1" value="'+w+'" aria-label="Cân nặng trên Trái Đất"></label>'+
    '</div><div class="hl" id="hl"></div><div class="you" id="youCards"></div>'+
    '<p class="lead" style="margin:30px 0 0;font-size:.87rem">Con số cân nặng là trọng lượng bạn cảm thấy dưới lực hấp dẫn ở đó. Lượng vật chất trong người bạn thì không đổi đi đâu cả. Với bốn hành tinh khí, đó là lực hấp dẫn ở lớp mây trên cùng, vì chúng không hề có mặt đất để đứng.</p></div>';
  $('#ager').addEventListener('input',function(){S.age=+this.value;save();refreshYou()});
  $('#wtr').addEventListener('input',function(){S.wt=+this.value;save();refreshYou()});
  youBuilt=true;refreshYou()}

/* ---------- boot ---------- */
if(S.seen.indexOf(sel)<0){S.seen.push(sel);save()}
counter();drawReadout();drawRuler();fit();loop();
})();
</script>
